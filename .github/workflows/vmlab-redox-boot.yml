name: vmlab-redox-boot

# Redox desktop image: boot time and screenshots, KVM vs TCG, BIOS vs UEFI.
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'vmlab/**'
      - '!vmlab/README.md'
      - '.github/workflows/vmlab-redox-boot.yml'

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
        fw: [bios, uefi]
    steps:
      - uses: actions/checkout@v4

      - name: KVM and tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils tesseract-ocr zstd ovmf
          qemu-system-x86_64 --version | head -1

      - name: Scenario (Enter at the bootloader menu, then a screenshot every 5 s)
        run: |
          N=$([ "${{ matrix.accel }}" = kvm ] && echo 24 || echo 90)
          {
            echo 'wait 8'
            echo 'shot bootloader'
            echo 'key ret'
            for i in $(seq 1 $N); do printf 'wait 5\nshot s%03d\n' $((i*5)); done
            echo 'stable 10 60'
            echo 'shot final'
          } > /tmp/scenario.txt

      - name: Boot and capture
        env:
          VMLAB_ACCEL: ${{ matrix.accel }}
        run: |
          date -u +%T
          python3 vmlab/vmlab.py run --guest vmlab/guests/redox-${{ matrix.fw }}.json --scenario /tmp/scenario.txt
          date -u +%T

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-boot-${{ matrix.accel }}-${{ matrix.fw }}
          path: |
            /tmp/vmlab/shots
            /tmp/vmlab/qemu.log
            /tmp/vmlab/serial.log
          if-no-files-found: ignore
