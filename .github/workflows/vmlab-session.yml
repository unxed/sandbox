name: vmlab-session

# Interactive QEMU guest inside Actions: see vmlab/ctl.py. Commands arrive via
# branch vmlab-cmd, screenshots/logs go to branch vmlab-out. Runs on dispatch
# only; pushes to vmlab-* branches by GITHUB_TOKEN do not trigger workflows.
on:
  workflow_dispatch:
    inputs:
      guest:    {description: 'vmlab/guests/<name>.json', default: 'haiku'}
      minutes:  {description: 'max session length',       default: '30'}
      scenario: {description: 'vmlab/scenarios/<name>.txt replayed before hand-over (optional)', default: ''}
      loadvm:   {description: 'restore this VM snapshot from the newest snapshot cache of the guest (optional)', default: ''}

permissions:
  contents: write
  actions: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: KVM + tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "NO /dev/kvm (TCG fallback, will be slow)"
          nproc; free -m | head -2
          if ! command -v qemu-system-x86_64 >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils tesseract-ocr zstd ovmf
          fi
          qemu-system-x86_64 --version | head -1; lscpu | grep -E "Model name|Flags" | cut -c1-120

      - name: Payload = latest successful f4-haiku binary
        continue-on-error: true
        run: |
          mkdir -p /tmp/vmlab/payload
          ID=$(gh run list --workflow f4-haiku.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          echo "f4-haiku run: $ID"
          gh run download "$ID" -n f4-haiku-amd64 -D /tmp/vmlab/payload
          chmod +x /tmp/vmlab/payload/f4-haiku-amd64 || true
          ls -l /tmp/vmlab/payload

      - name: Payload = guest agent
        run: |
          mkdir -p /tmp/vmlab/payload
          cp vmlab/guests/*.ion /tmp/vmlab/payload/ 2>/dev/null || true

      - name: Restore snapshot cache
        if: inputs.loadvm != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vmlab/base.img
            /tmp/vmlab/overlay.qcow2
            /tmp/vmlab/OVMF_VARS.qcow2
          key: vmlab-snap-${{ inputs.guest }}-none
          restore-keys: vmlab-snap-${{ inputs.guest }}-

      - name: Session
        run: |
          SCEN=""
          [ -n "${{ inputs.scenario }}" ] && SCEN="--scenario vmlab/scenarios/${{ inputs.scenario }}.txt"
          LOAD=""
          [ -n "${{ inputs.loadvm }}" ] && LOAD="--loadvm ${{ inputs.loadvm }}"
          python3 vmlab/vmlab.py session --guest vmlab/guests/${{ inputs.guest }}.json \
            --minutes ${{ inputs.minutes }} $SCEN $LOAD

      - name: Was a snapshot saved?
        id: saved
        if: always()
        run: '[ -f /tmp/vmlab/SAVED ] && echo saved=1 >> "$GITHUB_OUTPUT" || true'

      - name: Save snapshot cache
        if: always() && steps.saved.outputs.saved == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vmlab/base.img
            /tmp/vmlab/overlay.qcow2
            /tmp/vmlab/OVMF_VARS.qcow2
          key: vmlab-snap-${{ inputs.guest }}-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmlab-logs
          path: |
            /tmp/vmlab/qemu.log
            /tmp/vmlab/serial.log
          if-no-files-found: ignore
