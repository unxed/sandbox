name: video-frames

# Cuts a bug-report video into a contact sheet so it can be looked at (f4 #263).
on:
  push:
    branches: [ "video-frames" ]
    paths: [ ".github/workflows/video-frames.yml" ]

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cut
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL -o v.mp4 "https://github.com/user-attachments/assets/330fb084-aa1e-4c9d-ab23-050f3a5290c3"
          ffprobe -v error -show_entries stream=width,height,duration,r_frame_rate -of default=nw=1 v.mp4 || true
          mkdir out
          ffmpeg -loglevel error -i v.mp4 -vf "fps=3,scale=640:-1" out/f%03d.png
          ls out | wc -l
          # two contact sheets of 3 x 4 frames each
          ffmpeg -loglevel error -pattern_type glob -i 'out/f*.png' -vf "tile=3x4" -frames:v 3 out/sheet%d.png || true
          ls out | grep sheet || true
      - uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: out/sheet*.png
