name: f4-haiku

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'f4-haiku/**'
      - '.github/workflows/f4-haiku.yml'

jobs:
  build-toolchain-and-f4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v4

      - name: Set up bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Record bootstrap GOROOT
        run: echo "BOOTSTRAP_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Clone korli/go (Haiku port, branch golang-1.26-haiku)
        run: |
          git clone --branch golang-1.26-haiku --depth 60 https://github.com/korli/go.git /tmp/korli-go
          cd /tmp/korli-go
          echo "--- HEAD ---"
          git log -5 --oneline
          echo "--- VERSION ---"
          cat VERSION 2>/dev/null || echo "(no VERSION file)"
          # korli/go caught up with upstream (go1.26.8 at the time of
          # writing, >= the go1.26.6 floor in f4's go.mod), so the
          # temporary unxed/go fork is no longer needed. Its only extra
          # commits (syscall.FcntlInt / syscall.Getpgid) existed for our
          # x/sys shim, which is replaced by korli/sys_haiku below.

      - name: Build korli/go toolchain (host linux/amd64, cross target support for haiku)
        id: toolchain
        run: |
          set -o pipefail
          cd /tmp/korli-go/src
          GOROOT_BOOTSTRAP="$BOOTSTRAP_GOROOT" ./make.bash 2>&1 | tee /tmp/toolchain-build.log
        continue-on-error: true

      - name: Upload toolchain build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-build-log
          path: /tmp/toolchain-build.log
          if-no-files-found: ignore

      - name: Fail early if toolchain build failed
        if: steps.toolchain.outcome == 'failure'
        run: |
          echo "::error::korli/go toolchain build failed, see toolchain-build-log artifact"
          exit 1

      - name: Clone f4
        run: git clone --depth 1 https://github.com/unxed/f4.git /tmp/f4

      - name: Patch f4's own vfs package for haiku (local CI checkout only)
        working-directory: /tmp/f4
        run: |
          set -euo pipefail
          # os_vfs_posix_atim.go / rename_noreplace_unix.go gate a couple
          # of vfs helpers by an explicit OS allow-list; haiku wasn't in
          # either. Haiku's Stat_t uses the same Atim/Ctim field names as
          # linux/openbsd/dragonfly/solaris/illumos (verified against
          # github.com/korli/go's generated ztypes_haiku_amd64.go), and
          # like those it has no atomic no-clobber rename, so it joins
          # both lists unchanged otherwise. This patches only this
          # ephemeral CI checkout of f4, never the real repo.
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/f4-haiku.patch"

      - name: Show f4 go directive vs toolchain version
        run: |
          echo "--- f4 go.mod go directive ---"
          grep -m1 '^go ' /tmp/f4/go.mod
          echo "--- built toolchain version ---"
          /tmp/korli-go/bin/go version

      - name: Clone unxed/vtui at f4's pinned version and patch it for haiku
        run: |
          set -euo pipefail
          VTUI_VER="$(grep -oP 'github.com/unxed/vtui \K\S+' /tmp/f4/go.mod)"
          echo "f4 pins vtui at: $VTUI_VER"
          git clone --branch "$VTUI_VER" --depth 1 https://github.com/unxed/vtui.git /tmp/vtui-haiku
          cd /tmp/vtui-haiku
          # vtui's gogpu_*/gui_font*/x11_* files gate the GPU (goffi/FFI),
          # font-inventory and X11 backends per-OS. Haiku wasn't in any of
          # those lists, so it fell into the "GPU backend enabled" default
          # on the gogpu_* files (pulling in goffi's internal/fakecgo,
          # which has no Haiku threading support — a much bigger port than
          # this pass is scoped for) while also missing the font/X11
          # allow-lists entirely (no fallback there -> undefined symbols).
          # This patch places haiku exactly where illumos/solaris already
          # sit in every one of these lists: no GPU/gogpu backend (falls
          # back to the stub, same as those), but full X11 + font-inventory
          # support (all pure-Go, no native deps, same as those). See
          # f4-haiku/patches/vtui-haiku.patch in the sandbox repo for the
          # full rationale.
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/vtui-haiku.patch"
          echo "--- patched files ---"
          git diff --stat

      - name: Clone unxed/zip and patch its symlink chmod/chtimes path for haiku
        run: |
          set -euo pipefail
          ZIP_VER="$(grep -oP 'github.com/unxed/zip v\K\S+' /tmp/f4/go.mod)"
          echo "f4 pins zip at: $ZIP_VER"
          git clone --branch "v${ZIP_VER}" --depth 1 https://github.com/unxed/zip.git /tmp/zip-haiku
          cd /tmp/zip-haiku
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/zip-haiku.patch"

      - name: Clone spf13/afero and move haiku to its BSD-style errno fallback
        run: |
          set -euo pipefail
          AFERO_VER="$(grep -oP 'github.com/spf13/afero v\K\S+' /tmp/f4/go.mod)"
          echo "f4 pins afero at: $AFERO_VER"
          git clone --branch "v${AFERO_VER}" --depth 1 https://github.com/spf13/afero.git /tmp/afero-haiku
          cd /tmp/afero-haiku
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/afero-haiku.patch"

      - name: Clone pkg/sftp and add haiku to its unix attrs/ls allow-lists
        run: |
          set -euo pipefail
          SFTP_VER="$(grep -oP 'github.com/pkg/sftp v\K\S+' /tmp/f4/go.mod)"
          echo "f4 pins sftp at: $SFTP_VER"
          git clone --branch "v${SFTP_VER}" --depth 1 https://github.com/pkg/sftp.git /tmp/sftp-haiku
          cd /tmp/sftp-haiku
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/sftp-haiku.patch"

      - name: Clone tetratelabs/wazero and fix its Haiku Stat_t.Ino conversion
        run: |
          set -euo pipefail
          WAZERO_VER="$(grep -oP 'github.com/tetratelabs/wazero v\K\S+' /tmp/f4/go.mod)"
          echo "f4 pins wazero at: $WAZERO_VER"
          git clone --branch "v${WAZERO_VER}" --depth 1 https://github.com/tetratelabs/wazero.git /tmp/wazero-haiku
          cd /tmp/wazero-haiku
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/wazero-haiku.patch"

      - name: Clone unxed/archives (pinned commit) and fix its Haiku Stat_t.Ino conversion
        run: |
          set -euo pipefail
          ARCHIVES_REF="$(grep -oP 'github.com/unxed/archives v\K\S+' /tmp/f4/go.mod | grep -oP '(?<=-)[0-9a-f]{12}$')"
          echo "f4 pins archives at commit: $ARCHIVES_REF"
          git clone https://github.com/unxed/archives.git /tmp/archives-haiku
          cd /tmp/archives-haiku
          git checkout "$ARCHIVES_REF"
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/archives-haiku.patch"

      - name: Clone unxed/tar and split its Haiku symlink chtimes path
        run: |
          set -euo pipefail
          TAR_VER="$(grep -oP 'github.com/unxed/tar v\K\S+' /tmp/f4/go.mod)"
          echo "f4 pins tar at: $TAR_VER"
          git clone --branch "v${TAR_VER}" --depth 1 https://github.com/unxed/tar.git /tmp/tar-haiku
          cd /tmp/tar-haiku
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/tar-haiku.patch"

      - name: Clone golang.org/x/term and give it Haiku's termios ioctls
        run: |
          set -euo pipefail
          TERM_VER="$(grep -oP 'golang.org/x/term v\K\S+' /tmp/f4/go.mod)"
          echo "f4 pins x/term at: $TERM_VER"
          git clone --branch "v${TERM_VER}" --depth 1 https://github.com/golang/term.git /tmp/xterm-haiku
          cd /tmp/xterm-haiku
          # x/term has no Haiku support, so term.MakeRaw fails there and vtinput
          # never leaves canonical mode (found in a real Haiku VM: Enter arrives
          # as LF, input is line-buffered). Same fix as korli/term_haiku.
          git apply --verbose "$GITHUB_WORKSPACE/f4-haiku/patches/xterm-haiku.patch"

      - name: Point f4's build at all patched local checkouts
        working-directory: /tmp/f4
        run: |
          set -euo pipefail
          export PATH="/tmp/korli-go/bin:$PATH"
          go mod edit \
            -replace github.com/unxed/vtui=/tmp/vtui-haiku \
            -replace golang.org/x/sys=github.com/korli/sys_haiku@819bfec32e8f \
            -replace github.com/unxed/zip=/tmp/zip-haiku \
            -replace github.com/spf13/afero=/tmp/afero-haiku \
            -replace github.com/pkg/sftp=/tmp/sftp-haiku \
            -replace github.com/tetratelabs/wazero=/tmp/wazero-haiku \
            -replace github.com/unxed/archives=/tmp/archives-haiku \
            -replace github.com/unxed/tar=/tmp/tar-haiku \
            -replace golang.org/x/term=/tmp/xterm-haiku
          grep replace go.mod
          # golang.org/x/sys -> github.com/korli/sys_haiku, the Haiku port of
          # x/sys used by HaikuPorts (see e.g. www-apps/hugo recipe, which
          # tracks branch master-haiku; we pin the current commit of that
          # branch so CI runs are reproducible).

      - name: Attempt GOOS=haiku GOARCH=amd64 build of f4
        id: f4build
        working-directory: /tmp/f4
        env:
          GOOS: haiku
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOFLAGS: -v -mod=mod
          # fetch korli/* modules straight from GitHub, no proxy/sumdb
          GOPRIVATE: github.com/korli/*
        run: |
          set -o pipefail
          export PATH="/tmp/korli-go/bin:$PATH"
          export GOROOT=/tmp/korli-go
          go version
          go build -o /tmp/f4-haiku-amd64 ./cmd/f4 2>&1 | tee /tmp/f4-build.log
        continue-on-error: true

      - name: Build vmlab guest tools (ptyrun) with the same toolchain
        id: ptyrunbuild
        if: steps.f4build.outcome == 'success'
        continue-on-error: true
        working-directory: vmlab/haiku/ptyrun
        env:
          GOOS: haiku
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
          GOPRIVATE: github.com/korli/*
        run: |
          set -euo pipefail
          export PATH="/tmp/korli-go/bin:$PATH" GOROOT=/tmp/korli-go
          go mod edit -replace golang.org/x/sys=github.com/korli/sys_haiku@819bfec32e8f
          go build -o /tmp/ptyrun-haiku .

      - name: Upload guest tools
        if: steps.ptyrunbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: f4-haiku-tools
          path: /tmp/ptyrun-haiku
          if-no-files-found: ignore

      - name: Upload f4 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-build-log
          path: /tmp/f4-build.log
          if-no-files-found: ignore

      - name: Upload f4 binary (if built)
        if: steps.f4build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: f4-haiku-amd64
          path: /tmp/f4-haiku-amd64
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## f4 haiku build attempt"
            echo
            echo "Toolchain build: ${{ steps.toolchain.outcome }}"
            echo
            echo "f4 build: ${{ steps.f4build.outcome }}"
            echo
            echo '```'
            tail -n 100 /tmp/f4-build.log 2>/dev/null || echo "(no f4 build log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if f4 build failed
        if: steps.f4build.outcome == 'failure'
        run: exit 1
