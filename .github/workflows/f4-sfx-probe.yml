name: f4-sfx-probe

# Times what f4's "open as archive" does to large .exe files (f4 #1272):
# the embedded-archive scan, the copy of what it finds, and the open.
on:
  push:
    branches: [ "sfx-probe" ]
    paths: [ ".github/workflows/f4-sfx-probe.yml" ]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: unxed/f4
          path: f4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Fetch samples
        shell: bash
        run: |
          mkdir samples
          for v in 3.13.15 3.13.9 3.13.7; do
            if curl -fsSL -o samples/python-amd64.exe "https://www.python.org/ftp/python/$v/python-$v-amd64.exe"; then echo "python $v"; break; fi
          done
          curl -fsSL -o samples/7z-x64.exe "https://github.com/ip7z/7zip/releases/download/26.03/7z2603-x64.exe" || true
          ls -la samples
      - name: Build f4 as a sample
        shell: bash
        working-directory: f4
        run: go build -o ../samples/f4-sample.exe ./cmd/f4
      - name: Probe
        shell: bash
        working-directory: f4
        run: |
          cat > plugins/archive/probe1272_test.go <<'GO'
          package archive

          import (
          	"context"
          	"os"
          	"path/filepath"
          	"strings"
          	"testing"
          	"time"

          	"github.com/unxed/f4/vfs"
          )

          func TestProbe1272(t *testing.T) {
          	for _, p := range strings.Split(os.Getenv("PROBE_FILES"), ",") {
          		fi, err := os.Stat(p)
          		if err != nil {
          			t.Logf("%s: %v", p, err)
          			continue
          		}
          		t.Logf("== %s (%d bytes)", p, fi.Size())
          		t0 := time.Now()
          		emb, ok, err := findEmbeddedArchive(p)
          		t.Logf("scan: %v found=%v %+v err=%v", time.Since(t0), ok, emb, err)
          		t1 := time.Now()
          		emb2, backing, closer, err := materializeLocalSFX(p)
          		t.Logf("materialize: %v format=%q offset=%d backing=%q err=%v", time.Since(t1), emb2.format, emb2.offset, backing, err)
          		if closer != nil {
          			_ = closer.Close()
          		}
          		t2 := time.Now()
          		abs, _ := filepath.Abs(p)
          		v, err := NewArchiveVFSContext(context.Background(), vfs.NewOSVFS(filepath.Dir(abs)), abs)
          		t.Logf("open as archive: %v err=%v", time.Since(t2), err)
          		if v != nil {
          			_ = v.Close()
          		}
          	}
          }
          GO
          sed -i 's/^          //' plugins/archive/probe1272_test.go
          export PROBE_FILES="$GITHUB_WORKSPACE/samples/python-amd64.exe,$GITHUB_WORKSPACE/samples/7z-x64.exe,$GITHUB_WORKSPACE/samples/f4-sample.exe"
          go test ./plugins/archive -run TestProbe1272 -v -count=1 -timeout 30m 2>&1 | tail -60
