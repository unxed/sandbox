name: f4-su-conpty

# Probe for unxed/f4#207 and #1197: `su diskpart` + `exit` inside f4-gui's
# embedded terminal (ConPTY) leaves Enter and Backspace dead. Builds nothing
# locally: runs f4's own ConPTY panel on a Windows runner with the real su.exe.

on:
  push:
    branches: [ "su-conpty-probe", "su-conpty-*" ]
    paths: [ "f4-su-conpty/**", ".github/workflows/f4-su-conpty.yml" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unxed/f4
          ref: main
          path: f4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Get Seamless Sudo 1.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yegor-mialyk/tools/releases/download/v1.1.1/Sudo-1.1.1-x64.zip -OutFile sudo.zip
          Expand-Archive sudo.zip -DestinationPath sudo
          Get-ChildItem sudo -Recurse | Select-Object FullName, Length
      - name: Add the probe to a throwaway f4 checkout
        shell: bash
        run: |
          cp f4-su-conpty/su_probe_windows_test.go f4/internal/app/
          python f4-su-conpty/modeprobe.py f4
      - name: Session facts (UAC, integrity level)
        shell: pwsh
        run: |
          reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v EnableLUA
          reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v ConsentPromptBehaviorAdmin
          whoami /groups | Select-String -Pattern "Mandatory|Administrators"
          whoami /priv | Select-String -Pattern "SeDebug|SeImpersonate" 
      - name: Run the probe at the runner's own integrity level
        shell: pwsh
        working-directory: f4
        env:
          CGO_ENABLED: '0'
          SU_EXE: ${{ github.workspace }}\sudo\su.exe
        run: |
          go test ./internal/app -run TestSuConPTYProbe -v -count=1 -timeout 15m *>&1 | Tee-Object -FilePath ../probe.log
          exit 0
      - name: Run the probe at Medium integrity (limited scheduled task), su elevating for real
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          # Build the test binary first, at the runner's level, so the
          # Medium process only has to run it.
          Push-Location f4
          go test -c -o ..\appprobe.test.exe ./internal/app
          Pop-Location
          $ws = "${{ github.workspace }}"
          @"
          `$env:SU_EXE = '$ws\sudo\su.exe'
          Set-Location '$ws\f4\internal\app'
          whoami /groups | Select-String -Pattern 'Mandatory Label' | Out-File -Encoding utf8 '$ws\medium-who.txt'
          & '$ws\appprobe.test.exe' -test.run TestSuConPTYProbe -test.v -test.timeout 15m *>&1 | Out-File -Encoding utf8 '$ws\probe-medium.log'
          'done' | Out-File '$ws\medium-done.txt'
          "@ | Set-Content -Encoding utf8 "$ws\medium-run.ps1"
          # /RL LIMITED runs the task with the user's filtered (Medium) token;
          # /IT = interactive session, so no password is needed.
          schtasks /Create /TN f4probe /TR "powershell -NoProfile -ExecutionPolicy Bypass -File $ws\medium-run.ps1" /SC ONCE /ST 23:59 /RL LIMITED /IT /F
          schtasks /Run /TN f4probe
          $deadline = (Get-Date).AddMinutes(8)
          while (-not (Test-Path "$ws\medium-done.txt") -and (Get-Date) -lt $deadline) { Start-Sleep 3 }
          schtasks /Delete /TN f4probe /F
          if (Test-Path "$ws\medium-who.txt") { Get-Content "$ws\medium-who.txt" }
          if (Test-Path "$ws\probe-medium.log") { Get-Content "$ws\probe-medium.log" } else { "no probe-medium.log" }
          exit 0
      - name: Summary
        if: always()
        shell: bash
        run: |
          grep -E "RESULT|STATE|MODEPROBE|=== " probe.log | tee summary.txt || true
          echo "--- medium ---"; grep -E "Mandatory|RESULT|STATE|MODEPROBE|=== " probe-medium.log medium-who.txt 2>/dev/null | tee -a summary.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-log
          path: |
            probe.log
            probe-medium.log
            medium-who.txt
            summary.txt
