name: hx-build
run-name: "hx-build ${{ inputs.repo }}@${{ inputs.ref }} ${{ inputs.dirs }}"

# Build HX Win32 emulation DLLs (SrcEmu) with the tools of HXsrc.txt: nmake, JWasm, JWlink/JWlib.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: HX repository (owner/name)
        default: unxed/HX
      ref:
        description: branch, tag or commit
        default: master
      dirs:
        description: directories of SrcEmu to build, in order
        default: DKRNL32
      hxdev:
        description: release tag of Baron-von-Riedesel/HX whose HXDEV gives the import libraries (LIBCOFF)
        default: v2.23

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: hx
      - name: JWasm 2.20, JWlink 2.0
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Baron-von-Riedesel/JWasm/releases/download/v2.20/JWasm_v220_win32.zip -OutFile jwasm.zip
          Invoke-WebRequest https://github.com/Baron-von-Riedesel/jwlink/releases/download/v2.0/JWlinkb_v20_win32.zip -OutFile jwlink.zip
          Expand-Archive jwasm.zip -DestinationPath tools\jwasm
          Expand-Archive jwlink.zip -DestinationPath tools\jwlink
          foreach ($n in 'jwasm.exe','jwlink.exe','jwlib.exe') {
            $f = Get-ChildItem tools -Recurse -Filter $n | Select-Object -First 1
            if (-not $f) { throw "$n not found" }
            $f.DirectoryName | Out-File -Append $env:GITHUB_PATH
            "$n -> $($f.FullName)"
          }
          # wrc (Open Watcom) is only needed for DUSER32.RC (cursors): use rc.exe of the SDK
          New-Item -ItemType Directory -Force tools\wrc | Out-Null
          @(
            '@echo off'
            'set out='
            'set in='
            ':loop'
            'if "%~1"=="" goto run'
            'set a=%~1'
            'if /i "%a:~0,4%"=="-fo=" set out=%a:~4%'
            'if not "%a:~0,1%"=="-" set in=%a%'
            'shift'
            'goto loop'
            ':run'
            'rc.exe /nologo /fo "%out%" "%in%"'
          ) | Set-Content -Encoding ascii tools\wrc\wrc.cmd
          (Resolve-Path tools\wrc).Path | Out-File -Append $env:GITHUB_PATH
      - name: HXDEV (import libraries)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.hxdev }}" -R Baron-von-Riedesel/HX -p 'HXDEV*.zip' -D dl
          Expand-Archive (Get-ChildItem dl -Filter 'HXDEV*.zip')[0].FullName -DestinationPath hxdev
          $lib = (Get-ChildItem hxdev -Recurse -Filter 'dkrnl32.lib' | Where-Object { $_.Directory.Name -ieq 'Lib' } | Select-Object -First 1).DirectoryName
          if (-not $lib) { throw "Lib with dkrnl32.lib not found" }
          "HXLIB=$lib" | Out-File -Append $env:GITHUB_ENV
          "LIBCOFF: $lib"
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x86
      - name: build
        shell: cmd
        run: |
          for %%d in (${{ inputs.dirs }}) do (
            echo === %%d
            cd /d %GITHUB_WORKSPACE%\hx\SrcEmu\%%d || exit /b 1
            nmake /nologo RCBIN=wrc.cmd "LIBCOFF=%HXLIB%" || exit /b 1
          )
      - name: collect
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cd hx/SrcEmu
          find . \( -iname '*.dll' -o -iname '*.map' \) -newer ../HXsrc.txt -print -exec cp --parents {} ../../out/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx-build
          path: out
