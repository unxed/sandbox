name: f4-redox

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'f4-redox/**'
      - '.github/workflows/f4-redox.yml'

permissions:
  contents: read

env:
  # Redox Go toolchain: unxed/go branch golang-1.26-redox, pinned on purpose
  # (bump deliberately; another worker keeps pushing to that branch).
  GO_REDOX_SHA: 9adc5fe1685cf20e56f875f7aa7924363089c4f1
  # f4 is pinned too, so the patches in f4-redox/patches stay applicable.
  F4_SHA: 376b6611317c2032b3957ad74db2689108ef0220

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prefetch the redoxer image in the background
        run: nohup docker pull redoxos/redoxer > /tmp/docker-pull.log 2>&1 &

      - name: Restore cached Redox Go toolchain
        id: gocache
        uses: actions/cache@v4
        with:
          path: redox-go
          key: redox-go-${{ env.GO_REDOX_SHA }}-${{ hashFiles('f4-redox/patches/go/*.patch') }}

      - name: Fetch unxed/go (pinned)
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: unxed/go
          ref: ${{ env.GO_REDOX_SHA }}
          path: redox-go

      - name: Apply Go toolchain patches (until they land in unxed/go)
        if: steps.gocache.outputs.cache-hit != 'true'
        working-directory: redox-go
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/f4-redox/patches/go/*.patch; do
            echo "== $p"; git apply --verbose "$p"
          done

      - uses: actions/setup-go@v5
        if: steps.gocache.outputs.cache-hit != 'true'
        with:
          go-version: '1.24'
          cache: false

      - name: Build the Redox-capable Go toolchain (host linux/amd64)
        if: steps.gocache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: redox-go/src
        run: |
          export GOROOT_BOOTSTRAP=$(dirname $(dirname $(which go)))
          ./make.bash

      - name: Restore Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-f4-${{ env.F4_SHA }}

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-f4redox-${{ env.GO_REDOX_SHA }}-${{ github.run_id }}
          restore-keys: gobuild-f4redox-${{ env.GO_REDOX_SHA }}-

      - name: Clone f4 (pinned)
        run: |
          git clone https://github.com/unxed/f4.git /tmp/f4
          git -C /tmp/f4 checkout -q "$F4_SHA"
          git -C /tmp/f4 log -1 --oneline

      - name: Apply f4 patches
        working-directory: /tmp/f4
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/f4-redox/patches/f4/*.patch; do
            echo "== $p"; git apply --verbose "$p"
          done

      - name: Prepare modules (tag rule, x/sys/unix shim, replace directives)
        timeout-minutes: 8
        working-directory: /tmp/f4
        env:
          GOOS: redox
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
        run: |
          set -o pipefail
          export GOROOT=$GITHUB_WORKSPACE/redox-go
          export PATH=$GOROOT/bin:$PATH
          "$GITHUB_WORKSPACE/f4-redox/scripts/prep_modules.sh" 2>&1 | tee /tmp/prep.log

      - name: Recon - packages that do not load for redox, x/sys/unix symbols needed
        timeout-minutes: 8
        continue-on-error: true
        working-directory: /tmp/f4
        env:
          GOOS: redox
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
        run: |
          export GOROOT=$GITHUB_WORKSPACE/redox-go
          export PATH=$GOROOT/bin:$PATH
          go version
          go list -e -deps -json ./cmd/f4 > /tmp/deps.json 2> /tmp/deps.err || true
          tail -5 /tmp/deps.err || true
          mkdir -p /tmp/recon
          python3 "$GITHUB_WORKSPACE/f4-redox/scripts/recon.py" /tmp/deps.json /tmp/recon
          echo '--- packages with load errors ---'; cat /tmp/recon/pkg-errors.txt | head -80
          echo '--- x/sys/unix symbols ---'; wc -l /tmp/recon/unix-symbols.txt

      - name: Try GOOS=redox GOARCH=amd64 build of f4 (all errors, -gcflags=-e)
        id: f4build
        timeout-minutes: 8
        continue-on-error: true
        working-directory: /tmp/f4
        env:
          GOOS: redox
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
        run: |
          set -o pipefail
          export GOROOT=$GITHUB_WORKSPACE/redox-go
          export PATH=$GOROOT/bin:$PATH
          go build -gcflags=-e -ldflags='-s -w' -o /tmp/f4-redox-amd64 ./cmd/f4 2>&1 | tee /tmp/f4-build.log

      - name: Inspect the f4 binary
        if: steps.f4build.outcome == 'success'
        run: |
          ls -la /tmp/f4-redox-amd64
          file /tmp/f4-redox-amd64 || true
          readelf -l /tmp/f4-redox-amd64 | grep -i -A1 interp || true
          readelf -d /tmp/f4-redox-amd64 | grep -i needed || true

      - name: Build the pty harness (ptyrun) for redox
        if: steps.f4build.outcome == 'success'
        timeout-minutes: 4
        env:
          GOOS: redox
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
        run: |
          export GOROOT=$GITHUB_WORKSPACE/redox-go
          export PATH=$GOROOT/bin:$PATH
          rm -rf /tmp/ptyrun && cp -r f4-redox/harness/ptyrun /tmp/ptyrun && cd /tmp/ptyrun
          go mod edit -replace golang.org/x/sys=/tmp/mods/xsys
          go build -o /tmp/vmout-ptyrun .
          rm -rf /tmp/pollprobe && cp -r $GITHUB_WORKSPACE/f4-redox/harness/pollprobe /tmp/pollprobe && cd /tmp/pollprobe
          go mod edit -replace golang.org/x/sys=/tmp/mods/xsys
          go build -o /tmp/vmout-pollprobe .

      - name: Assemble the VM payload
        if: steps.f4build.outcome == 'success'
        run: |
          rm -rf /tmp/vmout && mkdir -p /tmp/vmout
          cp /tmp/f4-redox-amd64 /tmp/vmout/f4
          cp /tmp/vmout-ptyrun /tmp/vmout/ptyrun
          cp /tmp/vmout-pollprobe /tmp/vmout/pollprobe
          cp redox-go/.github/redox/run_common.sh /tmp/vmout/common.sh
          cp f4-redox/vm/smoke.sh /tmp/vmout/smoke.sh
          chmod +x /tmp/vmout/f4 /tmp/vmout/ptyrun /tmp/vmout/pollprobe
          du -sh /tmp/vmout; ls -la /tmp/vmout

      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "no /dev/kvm"

      - name: Run f4 in the Redox VM (redoxer/QEMU)
        id: vmrun
        if: steps.f4build.outcome == 'success'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          PKGOUT=/tmp/vmout QEMU_ARGS='-smp 4' f4-redox/vm/vm_run.sh smoke.sh /tmp/vm.log

      - name: Render captured screens
        if: always()
        continue-on-error: true
        run: |
          pip install -q pyte pillow
          mkdir -p /tmp/screens
          python3 f4-redox/scripts/render_screens.py /tmp/vm.log /tmp/screens 100 30 | tee /tmp/screens.log

      - name: Upload VM log and screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-redox-vm
          path: |
            /tmp/vm.log
            /tmp/screens
            /tmp/screens.log
          if-no-files-found: ignore

      - name: Upload f4 binary
        if: steps.f4build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: f4-redox-amd64
          path: /tmp/f4-redox-amd64
          compression-level: 9

      - name: Upload logs and recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-redox-build
          path: |
            /tmp/f4-build.log
            /tmp/prep.log
            /tmp/recon
            /tmp/deps.err
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## f4 redox build"
            echo
            echo "f4 build: ${{ steps.f4build.outcome }}"
            echo
            echo '### recon'
            echo '```'
            head -60 /tmp/recon/pkg-errors.txt 2>/dev/null || echo "(no recon output)"
            echo '```'
            echo '### VM run (tail)'
            echo '```'
            tail -60 /tmp/vm.log 2>/dev/null | cut -c1-200 || echo "(no VM log)"
            echo '```'
            echo '### screens'
            echo '```'
            head -80 /tmp/screens.log 2>/dev/null || echo "(no screens)"
            echo '```'
            echo '### build log (first 120 lines)'
            echo '```'
            head -120 /tmp/f4-build.log 2>/dev/null || echo "(no build log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
