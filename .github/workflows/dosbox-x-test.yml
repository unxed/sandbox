name: dosbox-x-test
run-name: "dosbox-x-test ${{ inputs.repo }}@${{ inputs.ref }}${{ inputs.m32 && ' m32' || '' }} ${{ inputs.cputype }}/${{ inputs.core }}${{ inputs.sse2int && ' sse2+double+int' || inputs.sse2double && ' sse2+double' || (inputs.sse2 && ' sse2' || '') }}"

# Build DOSBox-X from a branch of a fork and run the guest tests of dosbox-x-sse2/ (README there).

on:
  workflow_dispatch:
    inputs:
      repo:
        description: DOSBox-X repository (owner/name)
        default: unxed/dosbox-x
      ref:
        description: branch, tag or commit
        default: master
      cputype:
        description: cputype of the guest
        default: pentium_iii
      core:
        description: core of the guest
        default: normal
      sse2:
        description: "enable sse2 = true in the guest (and assemble the test with -DSSE2)"
        type: boolean
        default: false
      m32:
        description: "build a 32-bit DOSBox-X (multiarch): the only way to test core_dyn_x86"
        type: boolean
        default: false
      sse2int:
        description: "the branch has the integer XMM instructions (with sse2): run sse2i.com, expect them in ud.com"
        type: boolean
        default: false
      sse2double:
        description: "the branch has the double precision instructions (with sse2): run sse2.com, expect them in ud.com"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: dbx
      - name: packages
        run: |
          if [ "${{ inputs.m32 }}" = true ]; then
            sudo dpkg --add-architecture i386
            sudo sed -i 's/^Types: deb$/Types: deb/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq gcc-multilib g++-multilib autoconf automake libtool nasm pkg-config \
              libsdl2-dev:i386 libsdl2-net-dev:i386 libpng-dev:i386 libfreetype-dev:i386 libx11-dev:i386 \
              libxrandr-dev:i386 libxkbfile-dev:i386 libncurses-dev:i386 zlib1g-dev:i386 ccache > /dev/null
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq autoconf automake libtool nasm pkg-config libsdl2-dev libsdl2-net-dev \
              libpng-dev libfreetype-dev libx11-dev libxrandr-dev libxkbfile-dev libncurses-dev zlib1g-dev \
              libpcap-dev libslirp-dev ccache > /dev/null
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-dosbox-x-${{ runner.os }}-${{ inputs.m32 }}-${{ inputs.ref }}
          restore-keys: ccache-dosbox-x-${{ runner.os }}-
      - name: build
        working-directory: dbx
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          ./autogen.sh
          if [ "${{ inputs.m32 }}" = true ]; then
            export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig
            ./configure --host=i686-linux-gnu --enable-sdl2 --disable-debug --disable-alsa-midi --disable-opengl \
              CFLAGS="-m32 -O2" CXXFLAGS="-m32 -O2" LDFLAGS="-m32"
          else
            ./configure --enable-sdl2 --disable-debug --disable-alsa-midi --disable-opengl
          fi
          make -j"$(nproc)" 2>&1 | tail -30
          ls -la src/dosbox-x
          echo '--- config.h:'; grep -E 'C_DYNAMIC_X86|C_DYNREC|C_CORE_INLINE|C_TARGETCPU|C_FPU_X86|C_X86' config.h | head -20
          ccache -s | head -5
      - name: guest tests
        run: |
          mkdir -p guest
          nasm -f bin ${{ inputs.sse2 && '-DSSE2' || '' }} ${{ inputs.sse2double && '-DSSE2DOUBLE' || '' }} ${{ inputs.sse2int && '-DSSE2INT' || '' }} dosbox-x-sse2/ud.asm -o guest/UD.COM
          nasm -f bin dosbox-x-sse2/sse2.asm -o guest/SSE2.COM
          nasm -f bin dosbox-x-sse2/sse2int.asm -o guest/SSE2I.COM
          cat > guest/dosbox-x.conf <<CONF
          [sdl]
          output=surface
          [dosbox]
          memsize=64
          [cpu]
          core=${{ inputs.core }}
          cputype=${{ inputs.cputype }}
          enable sse2=${{ inputs.sse2 }}
          [autoexec]
          mount c "$PWD/guest"
          c:
          ud.com > out.txt
          ${{ inputs.sse2double && 'sse2.com > out2.txt' || 'rem' }}
          ${{ inputs.sse2int && 'sse2i.com > out3.txt' || 'rem' }}
          exit
          CONF
          sed -i 's/^          //' guest/dosbox-x.conf
          cat guest/dosbox-x.conf
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          timeout 120 dbx/src/dosbox-x -conf guest/dosbox-x.conf -nopromptfolder -fastlaunch -exit > guest/dosbox.log 2>&1 || true
          tail -5 guest/dosbox.log
          echo "=== out.txt"; tr -d '\r' < guest/OUT.TXT | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "^DONE fails=00" <(tr -d '\r' < guest/OUT.TXT)
          if [ "${{ inputs.sse2int }}" = true ]; then
            echo "=== out3.txt"; tr -d '\r' < guest/OUT3.TXT | tee -a "$GITHUB_STEP_SUMMARY"
            grep -q "^DONE fails=00" <(tr -d '\r' < guest/OUT3.TXT)
          fi
          if [ "${{ inputs.sse2double }}" = true ]; then
            echo "=== out2.txt"; tr -d '\r' < guest/OUT2.TXT | tee -a "$GITHUB_STEP_SUMMARY"
            grep -q "^DONE fails=00" <(tr -d '\r' < guest/OUT2.TXT)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dosbox-x-test
          path: guest
